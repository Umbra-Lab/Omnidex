name: Feature request
description: Suggest something Omnidex should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with your asset library, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: The change you have in mind. Sketches and examples from other tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use now
