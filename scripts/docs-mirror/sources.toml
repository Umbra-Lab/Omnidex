# Vendor documentation sources for the local docs mirror.
#
# Each [[source]] is one documentation set. `{version}` is replaced by the installed
# product version in docs form (e.g. Blender 5.3.1 -> "5.3"); sources with
# `versioned = false` mirror the vendor's current docs into a `current/` folder.
#
# Fields
#   product      key matching versions.py (blender, houdini, unity, unreal, godot, ...)
#   name         folder name for this set under docs/<product>/<version>/
#   kind         reference | guide | best-practice  (agents can filter on it)
#   versioned    true if the URL carries the product version
#   start        crawl entry points
#   prefix       only URLs starting with one of these are followed and saved
#   pages        fixed page list instead of a crawl (crawl = false)
#   format       html (default) | markdown (page is already markdown, saved as-is)
#   selectors    content region selectors tried before the defaults (main, article, [role=main], body)
#   mode         static (default) | auto (static, then a headless browser via Crawl4AI if the page is
#                nearly empty) | browser (always Crawl4AI). Crawl4AI is optional; see the guide.
#   max_pages    hard cap per run, protects disk and the vendor's servers
#   enabled      false to skip by default (run it with --source <name>)
#
# These entry points were written from first-party URLs seen on 2026-11-20 but have not
# been crawled end-to-end yet. Run `docs_mirror.py fetch --dry-run` first and adjust.

[[source]]
product = "blender"
name = "python-api"
kind = "reference"
versioned = true
start = ["https://docs.blender.org/api/{version}/"]
prefix = ["https://docs.blender.org/api/{version}/"]
selectors = ["[role=main]"]
max_pages = 5000

[[source]]
product = "blender"
name = "manual"
kind = "guide"
versioned = true
start = ["https://docs.blender.org/manual/en/{version}/"]
prefix = ["https://docs.blender.org/manual/en/{version}/"]
selectors = ["[role=main]"]
max_pages = 4000

[[source]]
product = "blender"
name = "lab-mcp"
kind = "guide"
