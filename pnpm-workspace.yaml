packages:
  - 'native/uasset'

# Do NOT let pnpm turn the "ignored build scripts" gate into a hard error.
#
# pnpm 11 defaults strictDepBuilds=true, which makes `pnpm install` THROW
# (ERR_PNPM_IGNORED_BUILDS, exit code 1) whenever a dependency build script is
# skipped — even though those deps are listed under onlyBuiltDependencies below.
# In our environment Homebrew pnpm 11.1.3 still reports the allowlisted native
# deps as "ignored", so the gate fires and a clean `git clone && pnpm install`
# exits non-zero despite producing a fully working tree.
#
# Our root `postinstall` explicitly drives every native step that matters:
#   scripts/ensure-electron.mjs  -> downloads + unpacks the Electron binary
#   electron-rebuild             -> rebuilds better-sqlite3 + keytar at Electron ABI
#   scripts/apply-patches.mjs    -> applies the electron-trpc patch
# so the skipped dep build scripts are redundant; we only need pnpm to stop
# *failing* on them. Setting this false makes pnpm PRINT the notice instead of
# throwing — the same thing `pnpm dlx` does internally for native postinstalls.
# Scoped, safe replacement for the removed `dangerouslyAllowAllBuilds` stopgap:
# it does NOT auto-run arbitrary build scripts, it only fixes the exit code.
#
# KNOWN QUIRK: pnpm 11.1.3 appends an `allowBuilds:` placeholder stub to the
# BOTTOM of this file on EVERY `pnpm install` (it considers the allowlisted native
# deps' build scripts "ignored" regardless of strictDepBuilds and regardless of
# whether their binaries already exist on disk). The stub is HARMLESS: its values
# are the literal string "set this to true or false", not `true`, so pnpm builds
# nothing extra from it, and our postinstall does the real native work anyway.
# It is NOT committed. If it shows up in `git status`, just delete the appended
# block before committing — it does not affect a working tree either way.
strictDepBuilds: false

onlyBuiltDependencies:
  - '@swc/core'
  - better-sqlite3
  - electron
  - electron-winstaller
  - esbuild
  - keytar
  - sharp
patchedDependencies:
  'electron-trpc@1.0.0-alpha.0': patches/electron-trpc@1.0.0-alpha.0.patch
peerDependencyRules:
  ignoreMissing:
    - '@emotion/is-prop-valid'
allowBuilds:
  '@swc/core': set this to true or false
  better-sqlite3: set this to true or false
  electron: set this to true or false
  electron-winstaller: set this to true or false
  esbuild: set this to true or false
  keytar: set this to true or false
  sharp: set this to true or false
